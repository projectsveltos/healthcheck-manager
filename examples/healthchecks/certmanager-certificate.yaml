# Reports Degraded when a cert-manager Certificate's Ready condition is anything other
# than True, including when the condition is missing entirely.
---
apiVersion: lib.projectsveltos.io/v1beta1
kind: HealthCheck
metadata:
  name: certmanager-certificate-ready
spec:
  resourceSelectors:
  - group: "cert-manager.io"
    version: "v1"
    kind: "Certificate"
  evaluateHealth: |
    function evaluate()
      local hs = {}
      hs.status = "Healthy"
      hs.message = ""
      local unhealthy = {}

      for _, resource in ipairs(resources) do
        local metadata = resource.metadata or {}
        local conditions = (resource.status or {}).conditions or {}
        local ready = nil

        for _, condition in ipairs(conditions) do
          if condition.type == "Ready" then
            ready = condition
          end
        end

        if ready == nil or ready.status ~= "True" then
          local reason = ready and ready.reason or "Unknown"
          local msg = string.format("Certificate %s/%s not Ready (%s)",
                      metadata.namespace, metadata.name, reason)
          table.insert(unhealthy, {resource = resource, message = msg, status = "Degraded"})
        end
      end

      if #unhealthy > 0 then
        hs.resources = unhealthy
      end

      return hs
    end
