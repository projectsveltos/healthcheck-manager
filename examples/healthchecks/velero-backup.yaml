# Reports Degraded when a Velero Backup failed, and Progressing while it is still
# running or has not started yet. Anything with status.phase "Completed" is Healthy.
---
apiVersion: lib.projectsveltos.io/v1beta1
kind: HealthCheck
metadata:
  name: velero-backup-succeeded
spec:
  resourceSelectors:
  - group: "velero.io"
    version: "v1"
    kind: "Backup"
  evaluateHealth: |
    function evaluate()
      local hs = {}
      hs.status = "Healthy"
      hs.message = ""
      local unhealthy = {}

      for _, resource in ipairs(resources) do
        local metadata = resource.metadata or {}
        local status = resource.status or {}
        local phase = status.phase or "New"

        if phase == "Failed" or phase == "PartiallyFailed" or phase == "FailedValidation" then
          local msg = string.format("Backup %s/%s is %s", metadata.namespace, metadata.name, phase)
          table.insert(unhealthy, {resource = resource, message = msg, status = "Degraded"})
        elseif phase ~= "Completed" then
          local msg = string.format("Backup %s/%s is %s", metadata.namespace, metadata.name, phase)
          table.insert(unhealthy, {resource = resource, message = msg, status = "Progressing"})
        end
      end

      if #unhealthy > 0 then
        hs.resources = unhealthy
      end

      return hs
    end
