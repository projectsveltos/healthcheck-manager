# Reports Degraded when a CloudNativePG Cluster's status.phase says it is unrecoverable,
# and Progressing for any phase other than its documented healthy phase (bootstrapping,
# switchover, replica creation, and so on).
---
apiVersion: lib.projectsveltos.io/v1beta1
kind: HealthCheck
metadata:
  name: cnpg-cluster-healthy
spec:
  resourceSelectors:
  - group: "postgresql.cnpg.io"
    version: "v1"
    kind: "Cluster"
  evaluateHealth: |
    function evaluate()
      local hs = {}
      hs.status = "Healthy"
      hs.message = ""
      local unhealthy = {}

      for _, resource in ipairs(resources) do
        local metadata = resource.metadata or {}
        local status = resource.status or {}
        local phase = status.phase or ""

        -- CloudNativePG reports a human-readable phase string; these two are its
        -- documented terminal states, anything else is some form of transition.
        if phase == "Cluster is in an unrecoverable state, needs manual intervention" then
          table.insert(unhealthy, {resource = resource, message = phase, status = "Degraded"})
        elseif phase ~= "Cluster in healthy state" then
          local msg = string.format("Cluster %s/%s: %s", metadata.namespace, metadata.name, phase)
          table.insert(unhealthy, {resource = resource, message = msg, status = "Progressing"})
        end
      end

      if #unhealthy > 0 then
        hs.resources = unhealthy
      end

      return hs
    end
