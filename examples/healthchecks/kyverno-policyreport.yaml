# Reports Degraded when a Kyverno PolicyReport's summary shows any failing or erroring
# rule. A report with zero fail/error counts is Healthy.
---
apiVersion: lib.projectsveltos.io/v1beta1
kind: HealthCheck
metadata:
  name: kyverno-policyreport-compliant
spec:
  resourceSelectors:
  - group: "wgpolicyk8s.io"
    version: "v1alpha2"
    kind: "PolicyReport"
  evaluateHealth: |
    function evaluate()
      local hs = {}
      hs.status = "Healthy"
      hs.message = ""
      local unhealthy = {}

      for _, resource in ipairs(resources) do
        local metadata = resource.metadata or {}
        local summary = resource.summary or {}
        local fail = summary.fail or 0
        local err = summary.error or 0

        if fail > 0 or err > 0 then
          local msg = string.format("PolicyReport %s/%s has %d failing and %d erroring rule(s)",
                      metadata.namespace, metadata.name, fail, err)
          table.insert(unhealthy, {resource = resource, message = msg, status = "Degraded"})
        end
      end

      if #unhealthy > 0 then
        hs.resources = unhealthy
      end

      return hs
    end
